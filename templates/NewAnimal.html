<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Register New Animal</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    body {
      padding-top: 20px;
      background-color: #f8f9fa;
    }

    .container {
      margin-top: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
      padding: 30px;
    }

    h2 {
      color: #007bff;
    }

    label {
      font-weight: bold;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
    }

    .btn-secondary {
      background-color: #6c757d;
      border: none;
    }

  </style>
</head>
<body>

  <div class="container my-4">
    <h2 class="mb-4">REGISTER NEW ANIMAL</h2>

    <form action="#" method="post">
      <div class="form-row">
        <div class="form-group col-md-12">
          <label for="sNo">S.No:</label>
          <input type="text" class="form-control" id="sNo" name="sNo" required>
        </div>
        
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
            <label for="date">Date:</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
        <div class="form-group col-md-6">
          <label for="time">Time:</label>
          <input type="time" class="form-control" id="time" name="time" required>
        </div>
        
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
            <label for="location">Location:</label>
            <input type="text" class="form-control" id="location" name="location" required>
          </div>
          <div class="form-group col-md-6">
        <label for="landmark">Landmark:</label>
        <input type="text" class="form-control" id="landmark" name="landmark" placeholder="User can enter area or landmark" required>
        </div>
    </div>

      <div class="form-row">
        <div class="form-group col-md-5">
          <label for="latitude">Latitude:</label>
          <input type="text" class="form-control" id="latitude" name="latitude" required>
        </div>
        <div class="form-group col-md-5">
          <label for="longitude">Longitude:</label>
          <input type="text" class="form-control" id="longitude" name="longitude" required>
        </div>
          <div class="form-group col-md-2">
              <label></label>
              <button onclick="getLocation()">Capture Location</button>
          </div>
      </div>

        <div>
            <video id="videoCam" playsinline autoplay></video>
            <button id="openCamera" type="button">Open Cam</button>
            <button id="captureButton" type="button">Capture Image</button>
            <button id="flipCamera" type="button">Flip Camera</button>
        </div>
      
      

      <div class="form-group">
        <label for="uploadPhoto">Upload Photo:</label>
        <input type="file" id="imageInput" name="image" accept="image/*" style="display: none;">
        <input type="button" value="Open Camera" onclick="openCamera()" style="cursor: pointer;">
        <br>
          <img id="previewImage" src="#" alt="Preview" style="display: none; max-width: 300px; margin-top: 10px;">
          <canvas id="previewImageCanvas" width="420" height="240"></canvas>
        <br>
        <input type="button" value="Confirm Upload" onclick="confirmUpload()" style="display: none; cursor: pointer;">
        <br>
        <input type="submit" value="Upload" style="display: none;">
      </div>

      <div class="form-group">
        <label for="animalType">Animal Type:</label>
        <input type="text" class="form-control" id="animalType" name="animalType" required>
      </div>

      <div class="form-group">
        <label for="status">Status of Animal when rescued:</label>
        <select class="form-control" id="status" name="status" required>
            <option value="Normal">Normal</option>
            <option value="Critical">Critical</option>
            <option value="Injured">Injured</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">SAVE</button>
      <button type="button" class="btn btn-secondary" onclick="redirectToHomePage()">CANCEL</button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


  <script>


      const videoCam = document.getElementById("videoCam");
      const previewImageCanvas = document.getElementById("previewImageCanvas");
      const captureButton = document.getElementById("captureButton");
      const openCam = document.getElementById("openCamera");
      const flipCameraButton = document.getElementById("flipCamera");

      let stream; // Store the stream globally
      let currentCamera = 'environment'; // 'environment' represents the back camera

      const constraint = {
          facingMode: currentCamera,
          audio: false,
          video: {
              width: 420,height:240
          }

      }

      async function init(){
          try{
              const stream = await navigator.mediaDevices.getUserMedia(constraint);
              handleSuccess(stream);
          }
          catch (e) {
              alert(e.toString())

          }
      }

      function handleSuccess(stream){
          window.stream = stream;
          videoCam.srcObject = stream;
      }

      //init();
      var context = previewImageCanvas.getContext('2d');

      captureButton.addEventListener("click",function(){
          context.drawImage(videoCam,0,0,420,240)
          if (stream && stream.getTracks) {
              stream.getTracks().forEach(track => track.stop());
          }
      });

      openCam.addEventListener("click",function(){
          init();
      })

      flipCameraButton.addEventListener("click", function () {
          // Check if stream is defined before accessing its tracks
          if (stream && stream.getTracks) {
              // Stop the current stream
              stream.getTracks().forEach(track => track.stop());
          }

          // Toggle between front and back cameras
          currentCamera = currentCamera === 'user' ? 'environment' : 'user';

          // Update constraints with the new facingMode
          constraint.video.facingMode = currentCamera;

          // Start the new stream
          init();
      });







    function redirectToHomePage() {
        confirmetion()
    }
    function confirmetion(){
        swal({
            title: "Are you sure?",
            text: "Want to cancel Registration",
            icon: "warning",
            buttons: true,
            dangerMode: true,
        })
            .then((willDelete) => {
                if (willDelete) {
                    window.location.href = '/'
                }
            });
    }

      function getLocation() {
          if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(showPosition, showError);
          } else {
              alert("Geolocation is not supported by this browser.");
          }
      }

      function showPosition(position) {
          const latitudeElement = document.getElementById("latitude");
          const longitudeElement = document.getElementById("longitude");

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          latitudeElement.value = latitude;
          longitudeElement.value = longitude;
      }

      function showError(error) {
          switch(error.code) {
              case error.PERMISSION_DENIED:
                  alert("User denied the request for Geolocation.");
                  break;
              case error.POSITION_UNAVAILABLE:
                  alert("Location information is unavailable.");
                  break;
              case error.TIMEOUT:
                  alert("The request to get user location timed out.");
                  break;
              case error.UNKNOWN_ERROR:
                  alert("An unknown error occurred.");
                  break;
          }
      }

  </script>

</body>
</html>
