<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="https://animalrescuesresources.blr1.digitaloceanspaces.com/icons/icon.ico">
    <title>Release Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            padding: 30px;
        }

        h2 {
            color: #007bff;
        }

        label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }
        .bg-modal {
            background-color: rgba(0, 0, 0, 0.8);
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .modal-contents {
            height: 95%;
            width: 95%;
            background-color: white;
            text-align: center;
            padding: 30px;
            position: fixed;
            border-radius: 4px;
        }



    </style>
</head>
<body>
<div class="bg-modal">
    <div class="modal-contents">
        <div id="cameradiv">
            <div class="row">
                <video id="videoCam" playsinline autoplay width="100%" height="90%" style="z-index: 1"></video>
            </div>
            <div class="row">
                <div class="col">
                    <button id="openCamera" type="button" hidden>Open Cam</button>
                </div>
                <div class="col">
{#                    <button id="captureButton" type="button" >Capture Image</button>#}
                    <button type="button" class="btn btn-dark btn-lg" id="captureButton">
                        <i class="fa fa-camera"></i>
                    </button>
                </div>
                <div class="col">
                    <button id="flipCamera" type="button" hidden>Flip Camera</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-5 text-center align-middle">
    <div class="row">
        <div class="col-12">
            <a href="/"><img
                    src="https://animalrescuesresources.blr1.digitaloceanspaces.com/icons/logo.jpg"
                    class='m-2 img-fluid' alt="AnimalRescue"></a>

        </div>
        <div style="margin-bottom: 20px;">

        </div>


    </div>
</div>

<div class="container my-4">
    <h2 class="mb-4 text-center">RELEASE ANIMAL</h2>

    <form method="post" id="formRelease">
        {% csrf_token %}
        <div class="form-group row">
            <label for="latitude">Step 1: Enter Serial No</label>
            <div class="col">
                <input type="text" class="form-control" id="reqslno" name="reqslno" required >
            </div>
            <div class="col">
                <button type="button" class="btn btn-primary" onclick="fetchData()">Fetch</button>
            </div>
        </div>
    </form>
    <div id="showDetails" style="display: none">
        <div class="container">
            <h4 class="text-center">Animal Details</h4>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th hidden scope="col">Slno</th>
                    <th scope="col">Animal Details</th>
                    <th scope="col">Photo</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td hidden><span id="slno"></span></td>
                    <td>
                        <div class="row">
                            <div class="col">
                                <div class="row">
                                    <h6>Animal</h6>
                                    <span id="animal"></span>
                                </div>
                                <div class="row">
                                    <h6>Landmark:</h6>
                                    <span id="landmark"></span>
                                </div>
                                <div class="row">
                                    <a id="releaseLocation" class="btn btn-primary m-2" style="width: 150px" target="_blank"><i class="fa fa-map-marker"></i> Open Map</a>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td><img src="#" id="pic" alt="animalpic" width="120" height="220"></td>
                </tr>
                </tbody>
            </table>
        </div>






    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="container">
            <h4 class="text-center">Release Form</h4>
            <div class="col">
                <label>S.NO</label>
                <input type="text" class="form-control" id="release_slno" name="release_slno" readonly  required>
            </div>
        </div>
        <div class="container">


        <div class="form-row " style="display: none">
            <label class="form-group mt-2">Step 2: Capture Location</label>
            <div class="form-group col-md-5">
                <label for="latitude" hidden>Latitude:</label>
                <input type="text" class="form-control" id="latitude" name="latitude" required hidden>
            </div>
            <div class="form-group col-md-5">
                <label for="longitude" hidden>Longitude:</label>
                <input type="text" class="form-control" id="longitude" name="longitude" required hidden>
            </div>
            <div class="form-group col-md-5">
                <label for="Variance" hidden>Variance:</label>
                <input type="text" class="form-control" id="variance" name="variance" required hidden>
            </div>
            <div class="form-group col-md-2">
                <label></label>
                <button type="button" class="btn btn-primary" onclick="getLocation()">Capture Location</button>
            </div>
        </div>
        <div id="LandmarkDiv" style="display: none">
            <div class="form-row mt-2">
                <div class="form-group col-md-6">
                    <label for="landmark">Step 3:Enter Landmark</label>
                    <input type="text" class="form-control" id="landmark" name="landmark" placeholder="enter area or landmark">
                </div>
            </div>
            <div class="row align-items-center justify-content-center">
                <button type="button" class="btn btn-primary m-2" style="width: 50px" onclick="divFlowChange(2)"><i class="fa fa-arrow-right"></i></button>
            </div>
        </div>





        <div id="CameraDiv" style="display: none">
            <div class="form-group align-items-center justify-content-center">
                <label class="form-group mt-2">Step 4: Open Camera</label>
                <div class="row align-items-center justify-content-center mt-1" style="height: 300px; width: 100%; overflow: auto">
                    <canvas id="previewImageCanvas" style="width: fit-content; height:300px;padding: 10px; border: 1px solid gray; border-radius: 10px"></canvas>
                </div>
                <input type="file" id="fileInputImage" name="fileInputImage" required hidden>
            </div>
            <div class="row align-items-center justify-content-center">
                <button id="openCameraBtn" type="button" style="width: 50px" class="btn btn-secondary mt-2  text-center"><i class="fa fa-camera"></i> </button>
            </div>

            <div class="form-group row align-items-center justify-content-center">
                <button type="button" class="btn btn-primary m-2" style="width: 50px" onclick="divFlowChange(1)"><i class="fa fa-arrow-left"></i> </button>
                <button type="button" class="btn btn-primary m-2" style="width: 50px" onclick="divFlowChange(3)"><i class="fa fa-arrow-right"></i></button>
            </div>
        </div>





        <div id="StatusDiv" style="display: none">
        <div class="form-group">
            <label for="status">Step 5: Status of Animal when released:</label>
            <select class="form-control" id="status" name="status" required>
                <option value="Cured">Cured</option>
                <option value="Critical">Critical</option>
                <option value="Died">Died</option>
            </select>
        </div>

            <div class="row align-items-center justify-content-center">
                <button type="button" class="btn btn-primary m-2" style="width: 50px" onclick="divFlowChange(2)"><i class="fa fa-arrow-left"></i></button>
                <button type="submit" name="saveButton" class="btn btn-success" style="width: 50px" onclick="validateForm()"><i class="fa fa-save"></i></button>
            </div>
        </div>
        <button type="button" class="btn btn-secondary" onclick="redirectToHomePage()"><i class="fa fa-remove"> Cancel</i></button>
    </form>
</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>



<script>
    divFlowChange(1);
    getLocation();
    function divFlowChange(id){
        const landmarkDivElement = document.getElementById('LandmarkDiv')
        const cameraDivElement = document.getElementById('CameraDiv')
        const statusDivElement = document.getElementById('StatusDiv')

        if(id === 1){
            landmarkDivElement.style.display = "block";
            cameraDivElement.style.display = "none";
            statusDivElement.style.display = "none";
        }
        if(id === 2){
            landmarkDivElement.style.display = "none";
            cameraDivElement.style.display = "block";
            statusDivElement.style.display = "none";
        }
        if(id === 3){
            landmarkDivElement.style.display = "none";
            cameraDivElement.style.display = "none";
            statusDivElement.style.display = "block";
        }
    }


    const videoCam = document.getElementById("videoCam");
    const previewImageCanvas = document.getElementById("previewImageCanvas");
    const captureButton = document.getElementById("captureButton");
    const openCam = document.getElementById("openCamera");
    const flipCameraButton = document.getElementById("flipCamera");
    const fileInput = document.getElementById("fileInputImage")

    let stream; // Store the stream globally
    let currentCamera = 'environment'; // 'environment' represents the back camera
    let isCameraOn = false; // Flag to track the camera status

    var pickup_lat,pickup_long;


    const constraint = {
        facingMode: 'environment',
        focus:true,
        audio: false,
        video: {
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }

    }

    async function init() {
        try {
            if (isCameraOn) {
                // If the camera is on, turn it off
                if (stream && stream.getTracks) {
                    stream.getTracks().forEach(track => track.stop());
                }
                isCameraOn = false;
            } else {
                // If the camera is off, turn it on
                constraint.video.facingMode = 'environment';
                stream = await navigator.mediaDevices.getUserMedia(constraint);
                handleSuccess(stream);
                isCameraOn = true;
            }
        } catch (e) {
            alert(e.toString());
        }
    }

    function handleSuccess(stream){
        window.stream = stream;
        videoCam.srcObject = stream;
    }

    //init();
    var context = previewImageCanvas.getContext('2d');

    captureButton.addEventListener("click",function(){
        const videoAspectRatio = videoCam.videoWidth / videoCam.videoHeight;

        // Set the width and height of the canvas
        previewImageCanvas.width = 500; // Adjust based on your layout
        previewImageCanvas.height = previewImageCanvas.width / videoAspectRatio;
        context.drawImage(videoCam,0,0,previewImageCanvas.width, previewImageCanvas.height)

        const imageDataUrl = previewImageCanvas.toDataURL('image/png');

        // Convert the data URL to a Blob
        const blob = dataURLtoBlob(imageDataUrl);

        // Create a File object from the Blob
        const file = new File([blob], 'captured_image.png', { type: 'image/png' });

        const dataTransfer = new DataTransfer();

        // Add the file to the DataTransfer object
        dataTransfer.items.add(file);

        // Set the DataTransfer object as the value for the file input
        fileInput.files = dataTransfer.files;

        // Set the File object as the value for the file input

        if (stream && stream.getTracks) {
            stream.getTracks().forEach(track => track.stop());
        }
        isCameraOn = false;
        turnoffCamera();
    });

    function dataURLtoBlob(dataURL) {
        const byteString = atob(dataURL.split(',')[1]);
        const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], { type: mimeString });
    }



    flipCameraButton.addEventListener("click", function () {
        // Check if stream is defined before accessing its tracks
        if (stream && stream.getTracks) {
            // Stop the current stream
            stream.getTracks().forEach(track => track.stop());
        }

        // Toggle between front and back cameras
        currentCamera = currentCamera === 'user' ? 'environment' : 'environment';

        // Update constraints with the new facingMode
        constraint.video.facingMode = 'environment';

        // Start the new stream
        init();
    });

    function distancebetweentwolocations(lat1, lon1, lat2, lon2) {
        // Radius of the Earth in kilometers
        const R = 6371.0;

        // Convert latitude and longitude from degrees to radians
        const [radLat1, radLon1, radLat2, radLon2] = [lat1, lon1, lat2, lon2].map(coord => (coord * Math.PI) / 180);

        // Calculate the differences in coordinates
        const dlat = radLat2 - radLat1;
        const dlon = radLon2 - radLon1;

        // Haversine formula
        const a = Math.sin(dlat / 2) ** 2 + Math.cos(radLat1) * Math.cos(radLat2) * Math.sin(dlon / 2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        // Calculate the distance
        const distance = R * c;

        return distance;
    }









    function redirectToHomePage() {
        confirmetion()
    }
    function confirmetion(){
        swal({
            title: "Are you sure?",
            text: "Want to cancel Release",
            icon: "warning",
            buttons: true,
            dangerMode: true,
        })
            .then((willDelete) => {
                if (willDelete) {
                    window.location.href = '/'
                }
            });
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError);
        } else {
            swal("Geolocation is not supported by this browser.");
        }
    }

    function showPosition(position) {
        const latitudeElement = document.getElementById("latitude");
        const longitudeElement = document.getElementById("longitude");
        const distanceVariance = document.getElementById("variance");


        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        var distance = distancebetweentwolocations(latitude,longitude,pickup_lat,pickup_long);
        distanceVariance.value = (distance * 1000).toFixed(0)

        if(distance<1){
            //swal("Distance from release Site is "+(distance*1000).toFixed(0)+" meter")
        }
        else {
            //swal("Distance from release Site is "+distance.toFixed(2)+" KM")
        }



        latitudeElement.value = latitude;
        longitudeElement.value = longitude;
    }

    function showError(error) {
        switch(error.code) {
            case error.PERMISSION_DENIED:
                alert("User denied the request for Geolocation.");
                break;
            case error.POSITION_UNAVAILABLE:
                alert("Location information is unavailable.");
                break;
            case error.TIMEOUT:
                alert("The request to get user location timed out.");
                break;
            case error.UNKNOWN_ERROR:
                alert("An unknown error occurred.");
                break;
        }
    }

    function getimageInFile(){
        const canvas = document.getElementById('previewImageCanvas');

        // Convert the canvas content to a data URL
        const imageDataUrl = canvas.toDataURL('image/png');

        // Create a hidden input field to store the image data
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'previewImage';
        hiddenInput.value = imageDataUrl;

        // Append the hidden input to the form
        this.appendChild(hiddenInput);
    }


    document.getElementById('openCameraBtn').addEventListener('click', function() {
        document.querySelector('.bg-modal').style.display = "flex";
        init()
    });

    function turnoffCamera(){
        document.querySelector('.bg-modal').style.display = "none";
        if (stream && stream.getTracks) {
            stream.getTracks().forEach(track => track.stop());
        }
        isCameraOn = false;



    }



    function fetchData(){
        const slno = document.getElementById("slno");
        const release_slno = document.getElementById("release_slno");
        const animal = document.getElementById("animal");
        const pic = document.getElementById("pic");
        const landmark = document.getElementById("landmark");
        const releaseLocation = document.getElementById("releaseLocation");

        const showDetailsDiv = document.getElementById("showDetails");


        var formRelease = $('#formRelease');
        $.ajax({
            url: '/releaseAnimal',
            type: 'POST',
            data: formRelease.serialize() + '&getAnimalDetails=getAnimalDetails',
            success: function(response) {
                console.log(response.status);
                responseStatus = response.status
                if(responseStatus == 200){
                    showDetailsDiv.style.display = 'block';
                    var data = JSON.parse(response.message)
                    slno.innerHTML = data.id;
                    release_slno.value = data.id;
                    animal.innerHTML = data.type;
                    pic.src = data.photo_url;
                    landmark.innerHTML = data.landmark;
                    var locationlink = 'https://maps.google.com/?q='+data.latitude+','+data.longitude;
                    releaseLocation.href = locationlink;
                    pickup_lat = data.latitude;
                    pickup_long = data.longitude;
                }else {
                    if(responseStatus == 404){
                        swal(response.message);
                        showDetailsDiv.style.display = 'none';
                    }
                }




                console.log(locationlink);
            },
            error: function(xhr, status, error) {
                console.error(xhr.responseText);
            }
        });
    }


    function validateForm(){
        getLocation();
        const latE = document.getElementById("latitude");
        const longE = document.getElementById("longitude");
        const file = document.getElementById('fileInputImage');

        if(file.files.length<=0){
            swal("Please Capture Picture")
        }else {
            getLocation();
        }

        if(latE.value.length <=0 || longE.value.length <= 0){
            swal("Please Capture Location")
        }else {
            getLocation();
        }
    }





</script>

</body>
</html>
