<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="https://animalrescuesresources.blr1.digitaloceanspaces.com/icons/icon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<style>
    .logoutButton {
        position: fixed;
        top: 0;
        right: 0;
        margin: 30px;
        /* Adjust the margin as needed */
    }

    /* Style for the Logout button */

</style>
<body>
<div class="container mt-5 text-center align-middle">
    <div class="row">
        <div class="col-12">
            <a href="/"><img
                    src="https://animalrescuesresources.blr1.digitaloceanspaces.com/icons/logo.jpg"
                    class='m-2 img-fluid' alt="AssistEd"></a>

        </div>
        <div style="margin-bottom: 20px;">

            {% if request.user.is_authenticated %}
            <button type="submit" style="width: 100px;color: #fff" onclick="location.href='/logout'" class="btn btn-info rounded-pill ms-2 mt-2 mb-2">Logout</button>
            {% else %}
                <a href="/login"><button type="submit" style="width: 100px;color: #fff" class="btn btn-info rounded-pill ms-2 mt-2 mb-2">login</button></a>
            {% endif %}

        </div>


    </div>
    <div class="logoutButton">

            <form action='/logout' method='POST'>
                {% csrf_token %}

            </form>


    </div>

    <div class="d-flex justify-content-center">

        <div class="row">
            <div class="col-sm">
                <button type='submit' onclick="location.href='registerAnimal'" style='background:transparent; border:0px'>
                    <div class="p-5 m-5"
                         style="box-shadow: 20px 20px 50px lightgrey;color: #fff;  height:150px; width:150px; background:#6495ED; border-radius:10px">
                        <h3><i class="fa fa-plus" aria-hidden="true" style="font-size: 70px"></i></h3>
                    </div>
                </button>
            </div>
            <div class="col-sm">
                <button type='submit' onclick="location.href='releaseAnimal'" style='background:transparent; border:0px'>
                    <div class="p-5 m-5"
                         style="box-shadow: 20px 20px 50px lightgrey;color: #fff; height:150px; width:150px; background:#6082B6; border-radius:10px">
                        <h3><i class="fa fa-minus" aria-hidden="true" style="font-size: 70px"></i></h3>
                    </div>

                </button>
            </div>

            <div class="col-sm">
                <button type='submit' onclick="location.href='report'" style='background:transparent; border:0px'>
                    <div class="p-5 m-5"
                         style="box-shadow: 20px 20px 50px lightgrey;color: #fff; height:150px; width:150px; background:#6F8FAF ; border-radius:10px">
                        <h3><i class="fa fa-table" aria-hidden="true" style="font-size: 70px"></i></h3>
                    </div>

                </button>
            </div>

        </div>
    </div>



<div style="margin-bottom: 20px;"> </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-b4gt3Kl9r5fQphWu3k/pjC9ur3ktQOp6zfrY9WlU5xKRKMtCru8+3RFApi7hjIbb" crossorigin="anonymous"></script>



</body>
</html>
